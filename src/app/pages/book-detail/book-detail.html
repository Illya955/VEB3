<div class="detail-page">

  @if (book) {

    <div class="book-detail">

      <h1>{{ book.title }}</h1>

      <p>
        <strong>Автор:</strong>
        {{ book.author }}
      </p>

      <p>
        <strong>Опис:</strong>
      </p>

      <p class="description">
        {{ book.description }}
      </p>

      <p>
        <strong>ID книги:</strong>
        {{ book.id }}
      </p>

      <a routerLink="/books" class="back-button">
        ← Назад до списку
      </a>

    </div>

  } @else {

    <div class="not-found">

      <h1>📕 Книгу не знайдено</h1>

      <p>
        Книги з таким ID не існує.
      </p>

      <a routerLink="/books" class="back-button">
        ← Повернутися до списку
      </a>

    </div>

  }

</div>
