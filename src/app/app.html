<div class="container">

  <h1>Студенти групи</h1>

  <h2>Додати нового студента</h2>

  <div class="form">

    <label>
      Ім'я:
      <input
        type="text"
        [(ngModel)]="newStudent.name"
        placeholder="Введіть ім'я"
      >
    </label>

    <label>
      Вік:
      <input
        type="number"
        [(ngModel)]="newStudent.age"
        placeholder="Введіть вік"
      >
    </label>

    <label>
      Середня оцінка:
      <input
        type="number"
        [(ngModel)]="newStudent.grade"
        min="1"
        max="12"
        placeholder="1-12"
      >
    </label>

    <button
      (click)="addStudent()"
      [disabled]="newStudent.name.trim() === ''"
    >
      Додати студента
    </button>

  </div>

  <hr>

  <h2>Список студентів</h2>

  <p class="counter">
    Всього студентів: {{ students.length }}
  </p>

  <div
    class="student"
    *ngFor="let student of students; let i = index"
    [ngClass]="getGradeClass(student.grade)"
  >

    <h3>{{ student.name }}</h3>

    <p>Вік: {{ student.age }}</p>

    <p>Середня оцінка: {{ student.grade }}</p>

    <p *ngIf="student.grade >= 10" class="excellent">
      Відмінний результат
    </p>

    <button (click)="deleteStudent(i)">
      Видалити
    </button>

  </div>

</div>
